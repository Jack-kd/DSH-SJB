name: Build APK

# 触发时机:
#  - push 到 main/master
#  - 打 v* tag(额外发布 GitHub Release,附 APK)
#  - PR / 手动运行(workflow_dispatch)
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug + release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (带缓存)
        uses: gradle/actions/setup-gradle@v4

      # 注意:不要用 android-actions/setup-android —— 该 action 内部执行
      # `sdkmanager tools`,而 Google 已下架旧 tools 包,必然失败。
      # ubuntu-latest 镜像自带 Android SDK,这里直接用 sdkmanager 补装组件。
      - name: Accept licenses & install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Collect APK info
        run: |
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # 打 v* tag 时,把编译产物发布为 GitHub Release(自动生成 changelog)
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: dsh-mobile-apks
          path: apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true
